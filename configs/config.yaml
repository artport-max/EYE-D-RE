# =====================================================
# Person Re-ID Project — Global Config
# =====================================================

# --- 데이터 경로 ---
data:
  video_dir: "data/raw_videos"
  frame_dir: "data/frames"
  tracklet_dir: "data/tracklets"
  filtered_dir: "data/filtered"

# --- 영상 파일 → (camera_id, time_slot) 매핑 ---
# 영상 파일 확장자가 다르면(.avi/.mov/.mkv) 키를 그대로 바꾸세요.
videos:
  cam1_t1.avi: {camera: 1, slot: 1}
  cam2_t1.avi: {camera: 2, slot: 1}
  cam3_t1.avi: {camera: 3, slot: 1}
  cam2_t2.avi: {camera: 2, slot: 2}
  cam3_t2.avi: {camera: 3, slot: 2}
  cam1_t3.avi: {camera: 1, slot: 3}
  cam2_t3.avi: {camera: 2, slot: 3}
  cam3_t3.avi: {camera: 3, slot: 3}
  cam1_t4.avi: {camera: 1, slot: 4}
  cam2_t4.avi: {camera: 2, slot: 4}
  cam3_t4.avi: {camera: 3, slot: 4}
  cam1_t5.avi: {camera: 1, slot: 5}
  cam2_t5.avi: {camera: 2, slot: 5}
  cam3_t5.avi: {camera: 3, slot: 5}
  cam1_t6.avi: {camera: 1, slot: 6}
  cam2_t6.avi: {camera: 2, slot: 6}
  cam3_t6.avi: {camera: 3, slot: 6}
  cam1_t7.avi: {camera: 1, slot: 7}
  cam2_t7.avi: {camera: 2, slot: 7}
  cam3_t7.avi: {camera: 3, slot: 7}
  cam1_t8.avi: {camera: 1, slot: 8}
  cam2_t8.avi: {camera: 2, slot: 8}
  cam3_t8.avi: {camera: 3, slot: 8}
  cam1_t9.avi: {camera: 1, slot: 9}
  cam2_t9.avi: {camera: 2, slot: 9}
  cam3_t9.avi: {camera: 3, slot: 9}
  cam1_t10.avi: {camera: 1, slot: 10}
  cam2_t10.avi: {camera: 2, slot: 10}
  cam3_t10.avi: {camera: 3, slot: 10}

# --- 프레임 추출 ---
frame_extraction:
  target_fps: 5 # 원본 25~30fps → 5fps 샘플링 (용량 절감)
  image_format: "jpg"
  jpg_quality: 95

# --- 검출 (YOLOv8n) ---
detection:
  model: "yolov8n.pt" # nano (최경량, 빠름)
  conf_threshold: 0.5
  iou_threshold: 0.45
  classes: [0] # COCO class 0 = person
  imgsz: 640
  device: "auto" # auto | cuda | cpu

# --- 트래킹 (BoT-SORT — Ultralytics 내장) ---
tracking:
  tracker_yaml: "configs/botsort.yaml"
  # botsort.yaml: Re-ID 외형 특징으로 겹침 상황 ID switch 방지
  # (bytetrack.yaml로 교체하면 이전 ByteTrack으로 복귀 가능)

# --- 품질 필터링 (보수적) ---
quality_filter:
  min_track_length: 30 # 최소 30 frame (5fps → 6초 이상의 영상만)
  min_avg_confidence: 0.7 # YOLO 평균 검출 신뢰도 
  min_bbox_height: 80 # px
  min_bbox_width: 40 # px
  max_aspect_ratio: 4.0 # height / width
  min_bbox_area: 5000 # px^2

# --- 기타 ---
runtime:
  seed: 42
  num_workers: 4
  log_level: "INFO"

# --- Cross-camera ID 병합 (Phase 1E) ---
reid:
  model_name: "osnet_x1_0" # OSNet 백본 모델 크기 (osnet_x1_0, osnet_x0_75 등)
  pretrained: true
  device: "auto" # auto | cuda | cpu
  batch_size: 64
  # HAC(Hierarchical Agglomerative Clustering) 하이퍼파라미터
  clustering:
    threshold: 0.12 # Cosine Distance 병합 임계치 (높을수록 더 쉽게 병합됨, 낮을수록 보수적)
    metric: "cosine"
    linkage: "average" # average | complete | single
    allow_cross_slot: false # false면 다른 시간대(slot) 병합 금지 - over-merge 방지(권장)

# --- Market-1501 포맷 변환 (Phase 1F) ---
market1501:
  output_dir: "data/market1501"
  train_ratio: 0.7 # 70%는 학습용(bounding_box_train), 30%는 평가용(query & bounding_box_test)

# --- Zero-shot 평가 (Phase 2) ---
evaluation:
  batch_size: 64
  top_k: [1, 5, 10]
  output_dir: "data/eval_results"
